services:
  app:
    build:
      context: ./docker/php
    image: ai-knowledge-base-app:dev
    container_name: kb-app
    working_dir: /var/www/html/laravel
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./storage/documents:/var/www/html/laravel/storage/app/documents
      - clamav_data:/var/lib/clamav:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [kb]

  worker:
    build:
      context: ./docker/php
    image: ai-knowledge-base-app:dev
    container_name: kb-worker
    working_dir: /var/www/html/laravel
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/queue.conf"]
    volumes:
      - ./backend:/var/www/html
      - ./storage/documents:/var/www/html/laravel/storage/app/documents
      - clamav_data:/var/lib/clamav:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [kb]

  scheduler:
    build:
      context: ./docker/php
    image: ai-knowledge-base-app:dev
    container_name: kb-scheduler
    working_dir: /var/www/html/laravel
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [kb]

  nginx:
    image: nginx:1.27-alpine
    container_name: kb-nginx
    restart: unless-stopped
    ports:
      - "82:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [kb]

  frontend:
    image: node:22-alpine
    container_name: kb-frontend
    restart: unless-stopped
    working_dir: /app/react-dashboard
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/react-dashboard/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [kb]

  mysql:
    image: mysql:8.4
    container_name: kb-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-knowledgebase}
      MYSQL_USER: ${MYSQL_USER:-knowledgebase}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-knowledgebase_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kb]

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["6380:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [kb]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: kb-qdrant
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [kb]

  # 4.12 Opt-in malware scanning. Enable with:
  #   docker compose --profile clamav up -d clamav
  # and set CLAMAV_ENABLED=true in backend/laravel/.env.
  clamav:
    image: clamav/clamav:stable
    container_name: kb-clamav
    profiles: ["clamav"]
    restart: unless-stopped
    environment:
      # The shared socket is private to the kb network; 666 lets www-data connect.
      CLAMD_CONF_LocalSocketMode: "666"
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [kb]

  # 3.8 Local-LLM stub for the future hybrid (OpenRouter -> Ollama) path.
  # Disabled by default (profile); enable with:
  #   docker compose --profile ollama up -d ollama
  # then use the OllamaProvider driver + ReEmbedDocumentsJob for the dim change.
  ollama:
    image: ollama/ollama:latest
    container_name: kb-ollama
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    networks: [kb]

networks:
  kb:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  ollama_data:
  clamav_data:
  frontend_node_modules:

services:
  app:
    build:
      context: ./docker/php
    container_name: kb-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./storage/documents:/var/www/html/storage/app/documents
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    networks: [kb]

  nginx:
    image: nginx:1.27-alpine
    container_name: kb-nginx
    ports:
      - "82:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [kb]

  frontend:
    image: node:22-alpine
    container_name: kb-frontend
    working_dir: /app
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks: [kb]

  mysql:
    image: mysql:8.4
    container_name: kb-mysql
    environment:
      MYSQL_DATABASE: knowledgebase
      MYSQL_USER: knowledgebase
      MYSQL_PASSWORD: knowledgebase_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [kb]

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    networks: [kb]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: kb-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes: [qdrant_data:/qdrant/storage]
    networks: [kb]

networks:
  kb:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  frontend_node_modules:

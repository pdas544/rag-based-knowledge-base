name: CI

on:
  push:
    branches: [main, user-feedback]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Laravel tests + Pint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/laravel
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, pcntl, bcmath, gd, zip, redis
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: vendor/bin/pint --test
      - run: php artisan test

  frontend:
    name: React lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/react-dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

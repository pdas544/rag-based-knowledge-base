# Production Laravel origin. Reached only through the frontend container
# (or an external load balancer); never published to the host directly.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/laravel/public;
    index index.php;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_read_timeout 3600s;
        fastcgi_buffering off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

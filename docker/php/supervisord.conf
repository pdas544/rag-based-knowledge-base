[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
logfile=/dev/null
logfile_maxbytes=0

# No `user=`: the queue runs as the same user as supervisord (root in the dev
# image, www-data in the production image).
[program:queue]
command=php /var/www/html/laravel/artisan queue:work --queue=embed,chat,default --tries=3 --sleep=3 --timeout=300
directory=/var/www/html/laravel
autostart=true
autorestart=true
numprocs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
